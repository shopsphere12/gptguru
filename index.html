<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Instant News Website</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      padding: 20px;
    }
    h1 { text-align: center; }
    .news {
      max-width: 800px;
      margin: 20px auto;
      background: white;
      padding: 15px;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    .news img { width: 100%; border-radius: 8px; }
    .news h2 { margin: 10px 0; }
    .news a { color: blue; text-decoration: none; }
  </style>
</head>
<body>
  <h1>Latest News</h1>
  <div id="newsContainer"></div>

  <script>
    const apiKey = "YOUR_API_KEY"; // Replace with your NewsAPI key
    const url = `https://newsapi.org/v2/top-headlines?country=in&apiKey=${apiKey}`;

    async function fetchNews() {
      const res = await fetch(url);
      const data = await res.json();
      const container = document.getElementById("newsContainer");
      container.innerHTML = "";
      data.articles.forEach(article => {
        const div = document.createElement("div");
        div.className = "news";
        div.innerHTML = `
          <img src="${article.urlToImage || ''}" alt="News Image">
          <h2>${article.title}</h2>
          <p>${article.description || ''}</p>
          <a href="${article.url}" target="_blank">Read more</a>
        `;
        container.appendChild(div);
      });
    }

    fetchNews();
    setInterval(fetchNews, 60000); // refresh every 1 minute
  </script>
</body>
</html>
